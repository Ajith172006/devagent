# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/api

# Load .env file for local dev (spring.config.import picks it up as key=value pairs)
spring.config.import=optional:file:.env[.properties]

# ── Database (PostgreSQL / SQL) ───────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devagent}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available if H2 database URL is specified)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Firebase ──────────────────────────────────────────────────────────────────
firebase.project-id=${FIREBASE_PROJECT_ID:devagent-c0aaf}

# ── Gemini AI ─────────────────────────────────────────────────────────────────
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ── GitHub ────────────────────────────────────────────────────────────────────
github.token=${GITHUB_TOKEN:}

# ── Admin ─────────────────────────────────────────────────────────────────────
admin.secret=${ADMIN_SECRET:}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:5174}

# ── Dev bypass (set to true to skip Firebase token verification) ──────────────
auth.bypass-firebase=${BYPASS_FIREBASE_AUTH:false}

# ── Multipart (for resume upload) ────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
